server:
  port: 8080

spring:
  main:
    allow-circular-references: true
  application:
    name: cims-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://cims-postgres-db:5432,127.0.0.1:5432/cims_db_dev}
    username: cims_user
    password: cims_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 15000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

cims:
  cbs:
    mode: ${CIMS_CBS_MODE:REAL} # Default to REAL CBS Oracle connection
    sync-mode: MANUAL
    scheduled-interval-ms: 3600000
    real:
      enabled: ${CIMS_CBS_REAL_ENABLED:true}
      base-url: ""
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
      authentication-type: "NONE"
    # =========================================================================
    # CBS PRODUCTION ORACLE 3-VIEW CONFIGURATION
    # Deployment Server: 172.22.10.55
    # CBS Oracle Server: 10.41.30.114:1521 / Service: FCUBUAT
    # Schema Owner: FCUBSLIVE / User: CBAIMSUSER
    # Password: Set via environment variable CIMS_CBS_PASSWORD (never hardcode)
    # =========================================================================
    oracle:
      jdbc-url: "${CIMS_CBS_JDBC_URL:jdbc:oracle:thin:@//10.41.30.114:1521/FCUBUAT}"
      username: "${CIMS_CBS_USERNAME:CBAIMSUSER}"
      password: "${CIMS_CBS_PASSWORD:}"
      schema: "${CIMS_CBS_SCHEMA:FCUBSLIVE}"
      customer-view: "${CIMS_CBS_CUSTOMER_VIEW:FCUBSLIVE.STVWCBS_CBAIMS_CUSTOMER}"
      facility-view: "${CIMS_CBS_FACILITY_VIEW:FCUBSLIVE.STVWCBS_CBAIMS_FACILITY}"
      collateral-view: "${CIMS_CBS_COLLATERAL_VIEW:FCUBSLIVE.STVWCBS_CBAIMS_COLLATERAL}"
      connect-timeout-ms: ${CIMS_CBS_CONNECT_TIMEOUT_MS:10000}
      read-timeout-ms: ${CIMS_CBS_READ_TIMEOUT_MS:300000}
      maximum-pool-size: ${CIMS_CBS_MAX_POOL_SIZE:10}
      minimum-idle: ${CIMS_CBS_MIN_IDLE:2}
      fetch-size: ${CIMS_CBS_FETCH_SIZE:2000}

logging:
  level:
    org.hibernate.SQL: INFO
    com.bank.cims: INFO
